<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{fragments/layout :: head('投稿一覧')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('posts')}"></header>
<main class="app-shell">
    <section class="page-hero">
        <div>
            <p class="page-kicker">Timeline</p>
            <h1>投稿一覧</h1>
            <p class="page-lead">チームの短い共有を、読みやすく整理して表示します。</p>
        </div>
        <form class="refresh-form" th:action="@{/posts/}" method="get">
            <button class="button button--secondary" type="submit">更新</button>
        </form>
    </section>

    <section class="surface">
        <form class="search-form" th:action="@{/posts}" method="get">
            <label class="search-form__label" for="q">検索</label>
            <input class="form-control" id="q" type="search" name="q" th:value="${query}" placeholder="本文・投稿者を検索">
            <button class="button" type="submit">検索</button>
        </form>
        <p class="flash-message flash-message--success"
           th:if="${successMessage != null}"
           th:text="${successMessage}">投稿を削除しました。</p>

        <h2 class="post-list__heading"
            th:if="${tagName != null}"
            th:text="|#${tagName} の投稿|">#Java の投稿</h2>
        <p class="empty-state" th:if="${#lists.isEmpty(posts) && tagName == null}">まだ投稿はありません。最初の一言を投稿しよう。</p>
        <p class="empty-state" th:if="${#lists.isEmpty(posts) && tagName != null}"
           th:text="|#${tagName} の投稿はまだありません。|">#Java の投稿はまだありません。</p>
        <article class="post" th:each="post : ${posts}">
            <div class="post__author-row">
                <span class="post__avatar-color"
                      th:classappend="${post.avatarColorCssClass()}"
                      aria-hidden="true"></span>
                <span class="post__author" th:text="${post.author}">投稿者</span>
            </div>
            <a class="post__body post-link"
               th:href="@{/posts/{id}(id=${post.id})}"
               th:text="${post.displayBody}">本文</a>
            <p class="post__tags" th:if="${!#lists.isEmpty(post.tagNames)}">
                <a th:each="tag : ${post.tagNames}"
                   class="post__tag post__tag--plain"
                   th:href="@{/tags/{name}(name=${tag})}"
                   th:text="|#${tag}|">#Java</a>
            </p>
            <p class="post__likes" th:text="|♥ ${post.likeCount}|">♥ 0</p>
            <time class="post__created-at"
                  th:datetime="${post.createdAt}"
                  th:text="${post.createdAt}">2026-05-23T09:00:00Z</time>
        </article>
    </section>
</main>
</body>
</html>
