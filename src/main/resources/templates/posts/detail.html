<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{fragments/layout :: head('投稿詳細')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('posts')}"></header>
<main class="app-shell app-shell--narrow">
    <section class="page-hero">
        <div>
            <p class="page-kicker">Post</p>
            <h1>投稿詳細</h1>
            <p class="page-lead">投稿の内容、タグ、リアクションを確認できます。</p>
        </div>
        <a class="button button--secondary" th:href="@{/posts}">一覧に戻る</a>
    </section>

    <article class="post post--detail">
        <div class="post__author-row">
            <span class="post__avatar-color"
                  th:classappend="${post.avatarColorCssClass()}"
                  aria-hidden="true"></span>
            <span class="post__author" th:text="${post.author}">投稿者</span>
        </div>
        <p class="post__body" th:text="${post.displayBody}">本文</p>
        <p class="post__tags" th:if="${!#lists.isEmpty(post.tagNames)}">
            <a th:each="tag : ${post.tagNames}"
               class="post__tag post__tag--plain"
               th:href="@{/tags/{name}(name=${tag})}"
               th:text="|#${tag}|">#Java</a>
        </p>
        <div class="post__likes">
            <span th:text="|♥ ${likeCount}|">♥ 0</span>
            <form th:action="@{/posts/{id}/likes(id=${post.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="button button--small" type="submit">Like</button>
            </form>
        </div>
        <form class="post__delete-form" th:action="@{/posts/{id}/delete(id=${post.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="button button--danger" type="submit">削除</button>
        </form>
        <time class="post__created-at"
              th:datetime="${post.createdAt}"
              th:text="${post.createdAt}">2026-05-23T09:00:00Z</time>
    </article>
</main>
</body>
</html>
