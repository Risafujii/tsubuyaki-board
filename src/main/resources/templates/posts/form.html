<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{fragments/layout :: head('新規投稿')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('new')}"></header>
<main class="app-shell app-shell--narrow">
    <section class="page-hero">
        <div>
            <p class="page-kicker">Compose</p>
            <h1>新規投稿</h1>
            <p class="page-lead">280文字以内で、チームに共有したいことを投稿します。</p>
        </div>
        <a class="button button--secondary" th:href="@{/posts}">一覧に戻る</a>
    </section>

    <form class="post-form" th:action="@{/posts}" th:object="${postForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="post-form__field">
            <label class="post-form__label" for="author">投稿者名 <span class="required-badge">必須</span></label>
            <input class="post-form__control form-control" type="text" id="author" th:field="*{author}" maxlength="30" required>
            <p class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">エラー</p>
        </div>
        <div class="post-form__field">
            <span class="post-form__label" id="avatarColorLabel">アバター色 <span class="required-badge">必須</span></span>
            <div class="avatar-color-picker" role="radiogroup" aria-labelledby="avatarColorLabel">
                <label class="avatar-color-picker__option" th:each="option : ${avatarColorOptions}">
                    <input class="avatar-color-picker__input"
                           type="radio"
                           name="avatarColor"
                           th:id="|avatarColor-${option.value}|"
                           th:value="${option.value}"
                           th:checked="*{avatarColor} == ${option.value}"
                           th:attr="aria-label=${option.displayName}"
                           required>
                    <span class="avatar-color-picker__chip post__avatar-color"
                          th:classappend="${option.cssClass}"
                          aria-hidden="true"></span>
                </label>
            </div>
            <p class="error" th:if="${#fields.hasErrors('avatarColor')}" th:errors="*{avatarColor}">エラー</p>
        </div>
        <div class="post-form__field">
            <label class="post-form__label" for="body">本文 (280 文字まで) <span class="required-badge">必須</span></label>
            <textarea class="post-form__control form-control" id="body" th:field="*{body}" maxlength="280" rows="5" required></textarea>
            <p class="error" th:if="${#fields.hasErrors('body')}" th:errors="*{body}">エラー</p>
        </div>
        <button class="button" type="submit">投稿</button>
    </form>
</main>
</body>
</html>
