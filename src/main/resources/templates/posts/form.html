<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新規投稿 - 社内つぶやきボード</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1>新規投稿</h1>
    <nav>
        <a th:href="@{/posts}">一覧に戻る</a>
    </nav>

    <form class="post-form" th:action="@{/posts}" th:object="${postForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="post-form__field">
            <label for="author">投稿者名</label>
            <input class="post-form__control" type="text" id="author" th:field="*{author}" maxlength="30" required>
            <p class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">エラー</p>
        </div>
        <div class="post-form__field">
            <label for="avatarColor">アバター色</label>
            <select class="post-form__control" id="avatarColor" th:field="*{avatarColor}" required>
                <option th:each="color : ${avatarColors}"
                        th:value="${color}"
                        th:text="${T(com.example.tsubuyaki.domain.AvatarColor).from(color).displayName}">青</option>
            </select>
            <p class="error" th:if="${#fields.hasErrors('avatarColor')}" th:errors="*{avatarColor}">エラー</p>
        </div>
        <div class="post-form__field">
            <label for="body">本文 (280 文字まで)</label>
            <textarea class="post-form__control" id="body" th:field="*{body}" maxlength="280" rows="4" required></textarea>
            <p class="error" th:if="${#fields.hasErrors('body')}" th:errors="*{body}">エラー</p>
        </div>
        <button type="submit">投稿</button>
    </form>
</main>
</body>
</html>
